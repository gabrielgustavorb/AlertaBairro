<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Reportar problema — AlertaBairro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-pagina="reportar">
  <header class="topbar">
    <div>
      <strong class="brand">AlertaBairro</strong>
      <small>Novo alerta</small>
    </div>
    <a class="icon-link" href="index.html" aria-label="Voltar">←</a>
  </header>

  <main class="container narrow">
    <section class="form-card">
      <span class="eyebrow">NOVO REGISTRO</span>
      <h1>Reportar problema</h1>
      <p class="muted">Quanto mais completa a informação, mais útil será o alerta.</p>

      <h2>1. Categoria</h2>
      <div id="cats" class="categories"></div>

      <h2>2. Descrição</h2>
      <textarea id="descricao" maxlength="500" rows="5" placeholder="Descreva o problema, por exemplo: poste apagado próximo à praça..."></textarea>
      <div class="counter"><span id="contadorDescricao">0</span>/500</div>

      <h2>3. Foto</h2>
      <div class="photo-actions">
        <button type="button" class="btn secondary" id="btnCamera">📷 Tirar foto</button>
        <button type="button" class="btn secondary" id="btnGaleria">🖼️ Escolher foto</button>
      </div>

      <input id="inCamera" type="file" accept="image/*" capture="environment" hidden>
      <input id="inGaleria" type="file" accept="image/*" hidden>

      <img id="preview" class="preview" alt="Prévia da foto">

      <button type="button" class="btn danger-outline" id="removerFoto">
        Remover foto
      </button>

      <h2>4. Localização</h2>

      <button type="button" class="btn secondary full" id="btnLoc">
        📍 USAR MINHA LOCALIZAÇÃO
      </button>

      <div id="statusLoc" class="status-msg" aria-live="polite"></div>

      <div class="or">
        <span>OU INFORME O ENDEREÇO</span>
      </div>

      <div class="address-grid">
        <label>CEP *
          <input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000">
        </label>

        <label>Rua *
          <input id="rua" placeholder="Rua / Avenida">
        </label>

        <label>Número *
          <input id="numero" inputmode="numeric" placeholder="Número">
        </label>

        <label>Bairro
          <input id="bairro" placeholder="Bairro">
        </label>

        <label class="wide">Complemento
          <input id="complemento" placeholder="Ex.: próximo à escola">
        </label>
      </div>

      <div id="erro" class="error" role="alert"></div>

      <button type="button" class="btn primary big full" id="publicar">
        PUBLICAR ALERTA
      </button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html">🏠<span>Início</span></a>
    <a href="mapa.html">🗺️<span>Mapa</span></a>
    <a class="active" href="reportar.html">➕<span>Reportar</span></a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
